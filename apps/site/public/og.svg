<!--
  Source of the share image the Site publishes as `/og.png` (#407).

  Authored as SVG and rasterised at build time by `src/share-image.ts` rather
  than committed as a PNG, so the card is diffable and reviewable: a designer
  reads and changes this file, and the build produces the raster. Open Graph and
  Twitter both need a raster — they do not render SVG — so the PNG is the
  published artifact and this is the source of truth for it.

  Colours are the brand tokens spelled out as the sRGB hexes `tokens.css`
  declares in `oklch`, because an SVG renderer has no cascade to resolve a brand
  token against. The same substitution is why the type below is a system sans
  rather than Bricolage Grotesque: the brand ships its fonts as woff2, and a
  rasteriser cannot read a web font from a data URI. The card is composed so that
  its identity comes from the mark, the palette, and the layout rather than from
  the typeface — which is also why the ledger panel is laid out in explicit
  coordinates with no text measurement: a renderer that fell back to a wider face
  would not reflow anything.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="PocketCircle">
  <title>PocketCircle: a shared ledger for a home, a trip, or a family</title>
  <defs>
    <!-- The Site's atmosphere: one solid iris blob behind a blur, which is how
         `site.css` paints it too. -->
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="60" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#0d0b13" />
  <circle cx="1090" cy="30" r="190" fill="#9568f3" fill-opacity="0.28" filter="url(#glow)" />

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Wordmark: the brand glyph, then the name. -->
    <circle cx="110" cy="104" r="21" fill="none" stroke="#9568f3" stroke-opacity="0.35" stroke-width="4" />
    <circle cx="110" cy="104" r="9" fill="#9568f3" />
    <text x="146" y="114" fill="#ebeaf2" font-size="28" font-weight="600" letter-spacing="-0.4"
      >PocketCircle</text
    >

    <!-- Headline. Reads at thumbnail size, so it is the largest thing here and
         breaks where the thought breaks rather than where the line runs out. -->
    <text fill="#ebeaf2" font-size="72" font-weight="600" letter-spacing="-2.2">
      <tspan x="88" y="296">Track the money you</tspan>
      <tspan x="88" y="376">share, together</tspan>
    </text>

    <text fill="#9593a4" font-size="26">
      <tspan x="88" y="452">A shared ledger for a home, a trip, or a family.</tspan>
      <tspan x="88" y="490">Everyone records what they paid for, and everyone</tspan>
      <tspan x="88" y="528">sees the same totals.</tspan>
    </text>

    <text x="88" y="580" fill="#9568f3" font-size="22" font-weight="600"
      >Free to use. No paid plan.</text
    >

    <!-- The product in one glance: a Circle's Monthly Ledger, the way the app
         draws it. Amounts sit on the second line of each row so a title of any
         length cannot collide with one. -->
    <g>
      <rect x="796" y="150" width="320" height="352" rx="20" fill="#16131e" stroke="#2b2738" />
      <text x="824" y="196" fill="#ebeaf2" font-size="21" font-weight="600">Apartment Home</text>
      <text x="824" y="222" fill="#9593a4" font-size="15">4 Members · Teal</text>

      <!-- Each row is a Category mark beside its Transaction, with the Member
           the money moved for named in the meta line. -->
      <g font-size="15">
        <rect x="824" y="254" width="34" height="34" rx="8" fill="#22c55e" fill-opacity="0.15" />
        <text x="841" y="276" fill="#22c55e" font-size="13" font-weight="600" text-anchor="middle">G</text>
        <text x="870" y="268" fill="#ebeaf2">Groceries — Costco</text>
        <text x="870" y="286" fill="#9593a4" font-size="12">Groceries · Maya</text>
        <text x="1088" y="286" fill="#ebeaf2" font-size="14" font-weight="600" text-anchor="end"
          >−$186.42</text
        >

        <rect x="824" y="306" width="34" height="34" rx="8" fill="#3b82f6" fill-opacity="0.15" />
        <text x="841" y="328" fill="#3b82f6" font-size="13" font-weight="600" text-anchor="middle">R</text>
        <text x="870" y="320" fill="#ebeaf2">March rent</text>
        <text x="870" y="338" fill="#9593a4" font-size="12">Rent · Jordan</text>
        <text x="1088" y="338" fill="#ebeaf2" font-size="14" font-weight="600" text-anchor="end"
          >−$2,100.00</text
        >

        <rect x="824" y="358" width="34" height="34" rx="8" fill="#f59e0b" fill-opacity="0.15" />
        <text x="841" y="380" fill="#f59e0b" font-size="13" font-weight="600" text-anchor="middle">U</text>
        <text x="870" y="372" fill="#ebeaf2">Utilities split</text>
        <text x="870" y="390" fill="#9593a4" font-size="12">Utilities · Alex</text>
        <text x="1088" y="390" fill="#ebeaf2" font-size="14" font-weight="600" text-anchor="end"
          >−$94.18</text
        >

        <rect x="824" y="410" width="34" height="34" rx="8" fill="#14b8a6" fill-opacity="0.15" />
        <text x="841" y="432" fill="#14b8a6" font-size="13" font-weight="600" text-anchor="middle">I</text>
        <text x="870" y="424" fill="#ebeaf2">Payback from Sam</text>
        <text x="870" y="442" fill="#9593a4" font-size="12">Income · Maya</text>
        <text x="1088" y="442" fill="#43d59a" font-size="14" font-weight="600" text-anchor="end"
          >+$62.00</text
        >
      </g>

      <line x1="824" y1="462" x2="1088" y2="462" stroke="#2b2738" />
      <text x="824" y="486" fill="#9593a4" font-size="14">Net this month</text>
      <text x="1088" y="486" fill="#ebeaf2" font-size="16" font-weight="600" text-anchor="end"
        >−$2,318.60</text
      >
    </g>
  </g>
</svg>
