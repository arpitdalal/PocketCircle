name: Deploy Production

on:
  workflow_run:
    workflows: [E2E]
    branches: [main]
    types: [completed]

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://pocketcircle.app
    env:
      APP_RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      VITE_CONVEX_SITE_URL: ${{ vars.VITE_CONVEX_SITE_URL }}
      VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
      VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
      VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate production configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CONVEX_DEPLOY_KEY" || { echo "::error::Missing CONVEX_DEPLOY_KEY secret"; exit 1; }
          test -n "$VITE_CONVEX_URL" || { echo "::error::Missing VITE_CONVEX_URL variable"; exit 1; }
          test -n "$VITE_CONVEX_SITE_URL" || { echo "::error::Missing VITE_CONVEX_SITE_URL variable"; exit 1; }

      - run: pnpm validate

      - name: Build production web app
        run: pnpm build

      # Worker before Convex: a new backend default (analyticsEnabled for new
      # Users) must not go live while production still serves the previous client.
      # This Worker must tolerate the previous Convex until the next step
      # finishes. Additive Convex functions the client needs immediately belong
      # in an earlier release.
      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.121.0"

      - name: Deploy Convex production backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: pnpm --filter @pocketcircle/convex exec convex deploy -y

      - name: Sync Convex release and Sentry env
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          SHORT_SHA="${APP_RELEASE_SHA:0:7}"
          pnpm --filter @pocketcircle/convex exec convex env set APP_RELEASE "$SHORT_SHA"
          pnpm --filter @pocketcircle/convex exec convex env set SENTRY_ENVIRONMENT production
          if [ -n "$VITE_SENTRY_DSN" ]; then
            pnpm --filter @pocketcircle/convex exec convex env set SENTRY_DSN "$VITE_SENTRY_DSN"
          else
            pnpm --filter @pocketcircle/convex exec convex env remove SENTRY_DSN
          fi
