name: Deploy Production

on:
  push:
    tags: [v*]

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify release
    uses: ./.github/workflows/e2e.yml

  deploy:
    needs: verify
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: production
      # Must equal `APP_ORIGIN` in packages/domain/src/origins.ts — a workflow
      # cannot import it, so `canonical-origins.test.ts` asserts the match.
      url: https://pocketcircle.app
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.ref }}

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Resolve immutable release
        id: release
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Production tags must be stable SemVer: vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate release notes
        run: ./scripts/release-notes.sh "${{ steps.release.outputs.version }}" >/dev/null

      - run: pnpm install --frozen-lockfile

      - name: Validate production configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          MCP_OAUTH_KV_NAMESPACE_ID: ${{ vars.MCP_OAUTH_KV_NAMESPACE_ID }}
          MCP_WORKER_HMAC_SECRET: ${{ secrets.MCP_WORKER_HMAC_SECRET }}
          MCP_WORKER_HMAC_SECRET_PREVIOUS: ${{ secrets.MCP_WORKER_HMAC_SECRET_PREVIOUS }}
          MCP_WORKER_SIGNING_PRIVATE_JWK: ${{ secrets.MCP_WORKER_SIGNING_PRIVATE_JWK }}
          MCP_WORKER_VERIFYING_JWKS: ${{ secrets.MCP_WORKER_VERIFYING_JWKS }}
          VITE_CONVEX_SITE_URL: ${{ vars.VITE_CONVEX_SITE_URL }}
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
          VITE_MCP_WORKER_ORIGIN: ${{ vars.VITE_MCP_WORKER_ORIGIN }}
          # Must equal `MIGRATION_APP_ORIGIN` and `APP_ORIGIN` in
          # packages/domain/src/origins.ts, the two origins the product Worker claims and
          # the one auth has to trust — a workflow cannot import it, so
          # `canonical-origins.test.ts` asserts the match.
          APP_ORIGIN: https://pocketcircle.app
          MIGRATION_APP_ORIGIN: https://app.pocketcircle.app
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CONVEX_DEPLOY_KEY" || { echo "::error::Missing CONVEX_DEPLOY_KEY secret"; exit 1; }
          test -n "$MCP_OAUTH_KV_NAMESPACE_ID" || { echo "::error::Missing MCP_OAUTH_KV_NAMESPACE_ID variable"; exit 1; }
          [[ "$MCP_OAUTH_KV_NAMESPACE_ID" =~ ^[0-9a-fA-F]{32}$ ]] || { echo "::error::MCP_OAUTH_KV_NAMESPACE_ID must be a 32-character hexadecimal namespace id"; exit 1; }
          test -n "$MCP_WORKER_HMAC_SECRET" || { echo "::error::Missing MCP_WORKER_HMAC_SECRET secret"; exit 1; }
          test -n "$MCP_WORKER_SIGNING_PRIVATE_JWK" || { echo "::error::Missing MCP_WORKER_SIGNING_PRIVATE_JWK secret"; exit 1; }
          test -n "$MCP_WORKER_VERIFYING_JWKS" || { echo "::error::Missing MCP_WORKER_VERIFYING_JWKS secret"; exit 1; }
          if [ -n "$MCP_WORKER_HMAC_SECRET_PREVIOUS" ] && [ "$MCP_WORKER_HMAC_SECRET_PREVIOUS" = "$MCP_WORKER_HMAC_SECRET" ]; then
            echo "::error::MCP_WORKER_HMAC_SECRET_PREVIOUS must differ from MCP_WORKER_HMAC_SECRET"
            exit 1
          fi
          test -n "$VITE_CONVEX_URL" || { echo "::error::Missing VITE_CONVEX_URL variable"; exit 1; }
          # The product Worker serves the app from the app subdomain as well as the apex
          # (#410), and auth only answers sign-in from an origin it trusts — which is
          # `MIGRATION_APP_ORIGIN` on this deployment, read when the auth routes load.
          # Serving the host without it is the one failure this window exists to prevent:
          # the app loads on the subdomain and sign-in there fails in the browser with no
          # detail. Checked here, before anything is deployed, because the deploy's own
          # origin check only proves the host serves the app. Drop this with the variable,
          # in the same deploy that points SITE_URL at the app origin (ADR 0035).
          set +e
          MIGRATION_ERR=$(mktemp)
          MIGRATION_OUT=$(pnpm --filter @pocketcircle/convex exec convex env get MIGRATION_APP_ORIGIN 2>"$MIGRATION_ERR")
          set -e
          MIGRATION=$(printf '%s' "$MIGRATION_OUT" | tr -d '[:space:]')
          # Either claimed origin is acceptable: auth trusts `SITE_URL` *and* this
          # variable, and between them they have to cover both hosts the Worker serves.
          # The apex is the documented rollback state, not a gap — a release that trusts
          # only the apex is not one where the subdomain is still being served.
          if [ "$MIGRATION" = "$MIGRATION_APP_ORIGIN" ] || [ "$MIGRATION" = "$APP_ORIGIN" ]; then
            rm -f "$MIGRATION_ERR"
          elif grep -qi 'not found' "$MIGRATION_ERR"; then
            echo "::error::MIGRATION_APP_ORIGIN is unset on this deployment, but the product Worker serves $MIGRATION_APP_ORIGIN — see README, origin migration"
            rm -f "$MIGRATION_ERR"
            exit 1
          else
            echo "::error::MIGRATION_APP_ORIGIN is '${MIGRATION:-unset}', want $MIGRATION_APP_ORIGIN (or $APP_ORIGIN while rolling back) — see README, origin migration" >&2
            cat "$MIGRATION_ERR" >&2
            rm -f "$MIGRATION_ERR"
            exit 1
          fi
          node --input-type=module -e '
            function requireHttpsOrigin(raw, name, { convexSite } = {}) {
              if (!raw?.trim()) {
                console.error(`::error::Missing ${name} variable`);
                process.exit(1);
              }
              let url;
              try {
                url = new URL(raw.trim());
              } catch {
                console.error(`::error::${name} is not a valid URL`);
                process.exit(1);
              }
              if (url.protocol !== "https:") {
                console.error(`::error::${name} must use HTTPS`);
                process.exit(1);
              }
              if (url.username || url.password) {
                console.error(`::error::${name} must not include credentials`);
                process.exit(1);
              }
              if (url.pathname !== "/" || url.search || url.hash) {
                console.error(`::error::${name} must be an origin without a path, query, or fragment`);
                process.exit(1);
              }
              if (convexSite) {
                const host = url.hostname;
                if (host !== "convex.site" && !host.endsWith(".convex.site")) {
                  console.error(`::error::${name} must be a Convex *.convex.site origin`);
                  process.exit(1);
                }
              }
            }
            requireHttpsOrigin(process.env.VITE_MCP_WORKER_ORIGIN, "VITE_MCP_WORKER_ORIGIN");
            requireHttpsOrigin(process.env.VITE_CONVEX_SITE_URL, "VITE_CONVEX_SITE_URL", {
              convexSite: true,
            });

            async function requireP256Key(key, { privateKey }) {
              const coordinate = /^[A-Za-z0-9_-]{43}$/;
              const allowed = new Set([
                "kty", "crv", "x", "y", "kid", "alg", "use", "key_ops", "ext",
                ...(privateKey ? ["d"] : []),
              ]);
              const expectedOperation = privateKey ? "sign" : "verify";
              if (
                !key ||
                Array.isArray(key) ||
                Object.keys(key).some((field) => !allowed.has(field)) ||
                key.kty !== "EC" ||
                key.crv !== "P-256" ||
                key.alg !== "ES256" ||
                typeof key.kid !== "string" ||
                key.kid.length === 0 || key.kid.length > 128 ||
                !coordinate.test(key.x) ||
                !coordinate.test(key.y) ||
                (privateKey ? !coordinate.test(key.d) : "d" in key) ||
                (key.use !== undefined && key.use !== "sig") ||
                (key.ext !== undefined && key.ext !== true) ||
                (key.key_ops !== undefined &&
                  (!Array.isArray(key.key_ops) ||
                    key.key_ops.length !== 1 ||
                    key.key_ops[0] !== expectedOperation))
              ) {
                console.error("::error::Invalid ES256 JWK configuration");
                process.exit(1);
              }
              try {
                await crypto.subtle.importKey(
                  "jwk",
                  key,
                  { name: "ECDSA", namedCurve: "P-256" },
                  false,
                  [expectedOperation],
                );
              } catch {
                console.error("::error::Invalid ES256 key material");
                process.exit(1);
              }
            }
            let privateJwk;
            let jwks;
            try {
              privateJwk = JSON.parse(process.env.MCP_WORKER_SIGNING_PRIVATE_JWK);
              jwks = JSON.parse(process.env.MCP_WORKER_VERIFYING_JWKS);
            } catch {
              console.error("::error::MCP Worker JWK secrets must contain valid JSON");
              process.exit(1);
            }
            await requireP256Key(privateJwk, { privateKey: true });
            if (
              !jwks ||
              Array.isArray(jwks) ||
              Object.keys(jwks).length !== 1 ||
              !Array.isArray(jwks.keys) ||
              jwks.keys.length < 1 ||
              jwks.keys.length > 2
            ) {
              console.error("::error::MCP_WORKER_VERIFYING_JWKS must contain one or two keys");
              process.exit(1);
            }
            for (const key of jwks.keys) await requireP256Key(key, { privateKey: false });
            if (new Set(jwks.keys.map((key) => key.kid)).size !== jwks.keys.length) {
              console.error("::error::MCP_WORKER_VERIFYING_JWKS key ids must be unique");
              process.exit(1);
            }
            const publicKey = jwks.keys.find((key) => key.kid === privateJwk.kid);
            if (!publicKey || publicKey.x !== privateJwk.x || publicKey.y !== privateJwk.y) {
              console.error("::error::Worker private JWK has no matching public JWKS key");
              process.exit(1);
            }
          '

      - run: pnpm validate

      - name: Build production web app
        env:
          APP_RELEASE_VERSION: ${{ steps.release.outputs.version }}
          APP_RELEASE_SHA: ${{ steps.release.outputs.sha }}
          VITE_CONVEX_SITE_URL: ${{ vars.VITE_CONVEX_SITE_URL }}
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
          VITE_MCP_WORKER_ORIGIN: ${{ vars.VITE_MCP_WORKER_ORIGIN }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
        run: pnpm build

      # The marketing Site (ADR 0035) goes first, and that ordering is the point:
      # it is static HTML on workers.dev, with no hostname, no Worker script, and
      # nothing any visitor sees. A failure here — a Cloudflare scope problem, an
      # invalid assets config, a build that does not compile — aborts the tag
      # before the Convex deploy, the product Worker, and the push-delivery gate
      # have moved at all. `packageManager` is explicit because the action infers
      # one from a lockfile in `workingDirectory`, and this repo's is at the root.
      - name: Build marketing Site
        run: pnpm build:site

      - name: Deploy marketing Site
        id: site
        uses: cloudflare/wrangler-action@v4
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          packageManager: pnpm
          wranglerVersion: "4.121.0"
          workingDirectory: apps/site

      # What a visitor gets on the staging hostname, asserted on the deployed
      # origin rather than on the artifact: the canonical apex origin the build
      # injected, the security headers derived from the product's policy, the
      # noindex that keeps `workers.dev` out of search results until the apex
      # cutover removes it, the sign-in link that leaves for the app origin, the
      # stylesheet the page is nothing but, and every published document answering
      # at the path it is cited at. The document is fetched, never executed, so what
      # is asserted here is what a browser without JavaScript would be given.
      # Retries because the asset manifest takes a moment to propagate, the same
      # reason the MCP discovery check below retries.
      - name: Verify marketing Site
        # APEX_ORIGIN and APP_ORIGIN must equal the constants in
        # packages/domain/src/origins.ts — a workflow cannot import it, so
        # `canonical-origins.test.ts` asserts it.
        env:
          APEX_ORIGIN: https://pocketcircle.app
          APP_ORIGIN: https://pocketcircle.app
          SITE_ORIGIN: ${{ steps.site.outputs.deployment-url }}
        run: |
          node --input-type=module <<'EOF'
          import { statSync } from "node:fs";
          import { readdir, readFile } from "node:fs/promises";
          const origin = new URL(process.env.SITE_ORIGIN).origin;
          const expected = {
            "x-frame-options": "DENY",
            "x-content-type-options": "nosniff",
            "referrer-policy": "strict-origin-when-cross-origin",
            "x-robots-tag": "noindex",
          };

          // Read once, before any retry: which documents this build published is a
          // property of the artifact, and waiting cannot change it, so a failure
          // here is a build problem and should not be retried twelve times as if it
          // were a propagation problem.
          const pages = (await readdir("apps/site/dist", { recursive: true }))
            .filter(
              (file) =>
                file.endsWith(".html") &&
                file !== "index.html" &&
                statSync(`apps/site/dist/${file}`).isFile(),
            )
            .sort();
          if (pages.length === 0) {
            throw new Error("the build published no page other than the homepage");
          }

          async function verify() {
            const response = await fetch(`${origin}/`);
            if (!response.ok) {
              throw new Error(`homepage returned ${response.status}`);
            }
            for (const [header, value] of Object.entries(expected)) {
              if (response.headers.get(header) !== value) {
                throw new Error(`${header} is ${response.headers.get(header)}, want ${value}`);
              }
            }
            const html = await response.text();
            // What the origin serves has to be the document this job built, byte
            // for byte, and that is what lets this step not read the metadata at
            // all.
            //
            // The `og:image` and `twitter:card` contract is asserted once, by
            // `apps/site/scripts/assert-site-html.mjs`, on these same bytes, through
            // the `metaContentOf` helper that does not care about attribute order or
            // quote style. A workflow cannot import that helper, so any check
            // written here would be a second and weaker parser of the same document
            // — and a legal, formatting-only edit to a `<meta>` tag in the source
            // would then fail all twelve retries *after* the site was already
            // uploaded, which is the worst possible time to learn about a
            // reformatting. Comparing bytes carries every assertion the build made
            // to the served origin instead, and is strictly more sensitive than the
            // two attributes that were being re-parsed here: it catches any document
            // that is not the asserted one.
            const builtDocument = await readFile("apps/site/dist/index.html");
            if (html !== builtDocument.toString("utf8")) {
              throw new Error(
                `the served homepage is ${html.length} characters and differs from the ${builtDocument.length} byte artifact this job built`,
              );
            }
            // Substring assertions, kept because they are cheap and order- and
            // quote-independent, and because a deploy that fails should say what is
            // wrong rather than only that two files differ.
            if (!html.includes(`<link rel="canonical" href="${process.env.APEX_ORIGIN}/"`)) {
              throw new Error("homepage does not canonicalize to the apex origin");
            }
            if (html.includes("%APEX_ORIGIN%")) {
              throw new Error("homepage still contains the apex origin placeholder");
            }
            // The homepage is a document, not a shell: the response has to
            // already carry the sign-in link to the app, without executing
            // anything. The sections and their order are asserted on the
            // artifact by `pnpm build:site` above.
            if (!html.includes(`href="${process.env.APP_ORIGIN}/signin"`)) {
              throw new Error("homepage does not link to the app's sign-in");
            }
            // Cloudflare caches each asset independently, so a propagated
            // document can be served next to a stylesheet that has not
            // propagated: a 200, fully-formed, correctly-headered *unstyled*
            // homepage, which every assertion above would pass. The page is one
            // stylesheet and nothing else, so this fetch is the whole visual
            // surface.
            const stylesheet = /<link rel="stylesheet"[^>]*href="([^"]+)"/.exec(html)?.[1];
            if (stylesheet === undefined) {
              throw new Error("homepage links no stylesheet");
            }
            const css = await fetch(new URL(stylesheet, `${origin}/`));
            if (!css.ok) {
              throw new Error(`homepage stylesheet returned ${css.status}`);
            }
            const { byteLength } = await css.arrayBuffer();
            if (byteLength === 0) {
              throw new Error("homepage stylesheet is empty — the brand tokens did not compile");
            }
            // The card a link to the apex renders as. It is the one asset a
            // crawler fetches from outside the page, so nothing above would
            // notice it 404ing, and the share would silently be a blank
            // rectangle.
            //
            // Fetched from *this* origin, not from the URL the tag names, and
            // that is deliberate: the tag has to name the apex for the cutover
            // to leave the site indexable at all, and until the cutover the apex
            // is still the product app, which answers an unmatched path with the
            // app's own index.html and a 200. Comparing the bytes the two halves
            // against the artifact this job built is what can be verified now, and
            // the cutover has to move the card onto the apex Worker and drop
            // `X-Robots-Tag` in the same change.
            //
            // The bytes, not the header: Cloudflare caches each asset
            // independently, so a propagated document can be served next to a card
            // that has not propagated, and a card from the *previous* release has
            // the same signature and the same dimensions as this one. Only the
            // bytes tell those apart. A served card that is not a PNG at all is
            // therefore already covered — it cannot equal the built artifact, and
            // `assert-site-html.mjs` is what asserts the built artifact really is a
            // 1200x630 PNG.
            const builtCard = await readFile("apps/site/dist/og.png");
            const cardResponse = await fetch(`${origin}/og.png`);
            if (!cardResponse.ok) {
              throw new Error(`the share image returned ${cardResponse.status}`);
            }
            const servedCard = Buffer.from(await cardResponse.arrayBuffer());
            if (!servedCard.equals(builtCard)) {
              throw new Error(
                `the served share image is ${servedCard.length} bytes and differs from the ${builtCard.length} byte artifact this job built`,
              );
            }
            // Every other page this build published, fetched at the path it is
            // cited at rather than at its file name. That mapping is the Worker's
            // `assets.html_handling`, so a document that is published but
            // unreachable is a 404 for exactly the links that must not break:
            // `/privacy` and `/terms` are on a Google branding application and in a
            // shipped plugin manifest (ADR 0035).
            //
            // Redirects are not followed, which is the whole point of the loop. A
            // plain fetch follows a 307 and reports 200 with the right bytes, so
            // `html_handling: "force-trailing-slash"` — which answers `/privacy`
            // with a hop to `/privacy/` — would pass every other assertion in this
            // step. The canonical path has to be served, not reached.
            //
            // The `.html` form is checked in the other direction, because a Worker
            // that served it as a second 200 would be duplicate content on the URLs
            // that must not move, and `auto-trailing-slash` is what 307s it to the
            // canonical one.
            //
            // Bytes, for the reason the homepage above is compared by bytes: a
            // Worker serving something else at that path — a stale document, or an
            // asset-not-found page — would pass a looser check. The homepage is
            // skipped because the assertions above already fetched it. Which pages
            // *should* exist is asserted on the source side, by
            // `apps/site/src/pages.test.ts` and by `assert-site-html.mjs` above;
            // what this adds is the one thing neither can see, which is the origin's
            // answer.
            for (const file of pages) {
              const path = `/${file.replace(/\.html$/, "")}`;
              const served = await fetch(`${origin}${path}`, { redirect: "manual" });
              if (served.status !== 200) {
                throw new Error(
                  `${path} answered ${served.status}, want the document itself`,
                );
              }
              const text = await served.text();
              const document = await readFile(`apps/site/dist/${file}`, "utf8");
              if (text !== document) {
                throw new Error(
                  `${path} is ${text.length} characters and is not the document this job built`,
                );
              }

              const alias = await fetch(`${origin}${path}.html`, { redirect: "manual" });
              if (alias.status === 200) {
                throw new Error(
                  `${path}.html is served as a second document instead of redirecting to ${path}`,
                );
              }
              if (alias.status < 300 || alias.status > 399) {
                throw new Error(`${path}.html answered ${alias.status}, want a redirect`);
              }
            }
          }

          let lastError;
          for (let attempt = 1; attempt <= 12; attempt += 1) {
            try {
              await verify();
              console.log(`Marketing Site verified at ${origin}`);
              process.exit(0);
            } catch (error) {
              lastError = error;
              console.warn(`Marketing Site attempt ${attempt}/12 failed: ${error.message}`);
              await new Promise((resolve) => setTimeout(resolve, 5_000));
            }
          }
          throw lastError;
          EOF

      # Install verification material before deploying code that requires it.
      # Current + previous keys let in-flight handoffs and the previously
      # deployed Worker remain valid while the new Worker rolls out.
      - name: Sync MCP Worker verification keys to Convex
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          MCP_WORKER_HMAC_SECRET: ${{ secrets.MCP_WORKER_HMAC_SECRET }}
          MCP_WORKER_HMAC_SECRET_PREVIOUS: ${{ secrets.MCP_WORKER_HMAC_SECRET_PREVIOUS }}
          MCP_WORKER_VERIFYING_JWKS: ${{ secrets.MCP_WORKER_VERIFYING_JWKS }}
          VITE_MCP_WORKER_ORIGIN: ${{ vars.VITE_MCP_WORKER_ORIGIN }}
        run: |
          pnpm --filter @pocketcircle/convex exec convex env set MCP_WORKER_VERIFYING_JWKS "$MCP_WORKER_VERIFYING_JWKS"
          if [ -n "$MCP_WORKER_HMAC_SECRET_PREVIOUS" ]; then
            pnpm --filter @pocketcircle/convex exec convex env set MCP_WORKER_HMAC_SECRET_PREVIOUS "$MCP_WORKER_HMAC_SECRET_PREVIOUS"
          fi
          pnpm --filter @pocketcircle/convex exec convex env set MCP_WORKER_HMAC_SECRET "$MCP_WORKER_HMAC_SECRET"
          if [ -z "$MCP_WORKER_HMAC_SECRET_PREVIOUS" ]; then
            pnpm --filter @pocketcircle/convex exec convex env remove MCP_WORKER_HMAC_SECRET_PREVIOUS
          fi
          pnpm --filter @pocketcircle/convex exec convex env set MCP_WORKER_ORIGIN "$VITE_MCP_WORKER_ORIGIN"

      # Convex before Worker: this release's web bundle needs additive Convex
      # fields/functions (Feature Announcements, #282) immediately. Deploy the
      # backward-compatible backend first. If Convex succeeds and the Worker
      # fails, leave the additive backend deployed and retry the Worker. Old
      # web code remains compatible with the new optional field and unused
      # functions. Breaking Convex changes still use expand-contract releases.
      #
      # Push delivery pauses until the Cloudflare assets (display-capable
      # push-sw.js) are live — silent Push can make Safari revoke permission.
      # Jobs keep enqueueing; send defers until enabled again.
      - name: Disable Push delivery for rollout
        id: push_gate
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          set +e
          ERR=$(mktemp)
          OUT=$(pnpm --filter @pocketcircle/convex exec convex env get PUSH_DELIVERY_ENABLED 2>"$ERR")
          STATUS=$?
          set -e
          PREV=$(printf '%s' "$OUT" | tr -d '[:space:]')
          if [ -n "$PREV" ]; then
            echo "previous_captured=true" >> "$GITHUB_OUTPUT"
            echo "previous=$PREV" >> "$GITHUB_OUTPUT"
          elif grep -qi 'not found' "$ERR"; then
            # Truly unset — pause as 0; no restore value to claim.
            echo "previous_captured=false" >> "$GITHUB_OUTPUT"
            PREV=0
          else
            # Auth/transport flake — do not pause without a restore path.
            echo "convex env get PUSH_DELIVERY_ENABLED failed (status=$STATUS):" >&2
            cat "$ERR" >&2
            rm -f "$ERR"
            exit 1
          fi
          rm -f "$ERR"
          pnpm --filter @pocketcircle/convex exec convex env set PUSH_DELIVERY_ENABLED 0

      - name: Deploy Convex production backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: pnpm --filter @pocketcircle/convex exec convex deploy -y

      - name: Deploy product app Worker
        uses: cloudflare/wrangler-action@v4
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.121.0"

      # What a User gets on the two hosts the app is served from (ADR 0035), asserted
      # against the artifact this job built rather than against a status: the shell at
      # `/`, every bundle it names, three deep links that only resolve through the
      # Worker's SPA fallback, the web manifest, and the push service worker. Runs
      # inside the push-delivery gate, so nothing re-enables push until the
      # display-capable service worker is the one being served.
      #
      # The apex is asserted only until the cutover hands it to the marketing Site; the
      # app-origin half outlives it, and the apex half goes with that deploy.
      - name: Verify product app origins
        # APP_ORIGIN and MIGRATION_APP_ORIGIN must equal the constants in
        # packages/domain/src/origins.ts — a workflow cannot import it, so
        # `canonical-origins.test.ts` asserts it. MIGRATION_APP_ORIGIN is the same
        # literal the configuration check above asserts auth already trusts.
        env:
          APP_ORIGIN: https://pocketcircle.app
          MIGRATION_APP_ORIGIN: https://app.pocketcircle.app
        run: |
          node --input-type=module <<'EOF'
          import { readFile } from "node:fs/promises";

          // Normalizing through `new URL` fails the step immediately, before any retry, if
          // an origin above is missing or is not a bare origin — a value that silently
          // became "undefined" would otherwise fetch nothing and pass.
          const origins = [process.env.APP_ORIGIN, process.env.MIGRATION_APP_ORIGIN].map(
            (value) => new URL(value).origin,
          );

          // Read once, before any retry, like the Site's check above: which documents,
          // which assets, and which header policy this build ships is a property of the
          // artifact, and waiting cannot change it. The directory comes from the Worker's
          // own config rather than being written out again here.
          const clientDirectory = /"directory"\s*:\s*"([^"]+)"/.exec(
            await readFile("wrangler.jsonc", "utf8"),
          )?.[1];
          if (clientDirectory === undefined) {
            throw new Error("wrangler.jsonc publishes no assets directory");
          }
          const shell = (await readFile(`${clientDirectory}/index.html`)).toString("utf8");
          const builtPushServiceWorker = await readFile(`${clientDirectory}/push-sw.js`);

          // The published header policy, read rather than restated, so this cannot pass
          // against a policy the app no longer ships — including the service worker's
          // `Cache-Control`, which is what stops a device caching a push handler it cannot
          // display. Cloudflare applies every rule that covers a request, so a path's
          // expected headers are the union of the rules that name it.
          const headerRules = (await readFile(`${clientDirectory}/_headers`, "utf8"))
            .split(/\n\s*\n/)
            .map((rule) => rule.trim())
            .filter(Boolean)
            .map((rule) => {
              const [pattern, ...headers] = rule.split("\n").map((line) => line.trim());
              return [
                pattern,
                Object.fromEntries(
                  headers.map((header) => {
                    const separator = header.indexOf(":");
                    return [
                      header.slice(0, separator).trim().toLowerCase(),
                      header.slice(separator + 1).trim(),
                    ];
                  }),
                ),
              ];
            });
          if (headerRules.length === 0) {
            throw new Error("the published _headers file has no rule");
          }
          /** Whether one `_headers` rule covers a request path. */
          function ruleCovers(pattern, path) {
            if (pattern.includes(":")) {
              // A placeholder would silently match nothing, and a policy check that skips
              // a rule is worse than no check.
              throw new Error(`_headers rule ${pattern} uses a placeholder this check cannot match`);
            }
            if (!pattern.endsWith("/*")) {
              return pattern === path;
            }
            const prefix = pattern.slice(0, -1);
            return path === prefix || path.startsWith(prefix);
          }
          function expectedHeadersFor(path) {
            return Object.assign(
              {},
              ...headerRules
                .filter(([pattern]) => ruleCovers(pattern, path))
                .map(([, headers]) => headers),
            );
          }

          // Every bundle the shell names, with the bytes this job built for it. A shell
          // that propagated ahead of its bundles is a 200 every assertion below passes and
          // an app that cannot boot. Content-hashed names mean a *stale* shell cannot
          // quietly pair with new bundles either — the bundle it names is gone.
          const builtAssets = new Map();
          for (const [, path] of shell.matchAll(/(?:src|href)="(\/assets\/[^"]+)"/g)) {
            builtAssets.set(path, await readFile(`${clientDirectory}${path}`));
          }
          if (builtAssets.size === 0) {
            throw new Error("the app shell names no built asset");
          }

          // One deep link of each shape the app hands out, at the shape it hands them out
          // in: a Circle Transaction, the same Transaction's edit form carrying the
          // filtered ledger it was opened from, and a search with filters. None has a file
          // behind it, so every one is answered by
          // `not_found_handling: "single-page-application"` — the whole of what makes a
          // cold load of a shared or bookmarked link work, on either host.
          const deepLinks = [
            "/circles/groceries-a1b2c3d4/transactions/coffee-a1b2c3d4",
            "/circles/groceries-a1b2c3d4/transactions/coffee-a1b2c3d4/edit?returnTo=%2Fcircles%2Fgroceries-a1b2c3d4%2Ftransactions%3Fmonth%3D2026-03",
            "/circles/groceries-a1b2c3d4/search?type=expense&min=10&max=250&page=1",
          ];

          async function verifyOrigin(origin) {
            async function fetchBuilt(path, built) {
              const response = await fetch(`${origin}${path}`, { redirect: "manual" });
              if (response.status !== 200) {
                throw new Error(`${origin}${path} answered ${response.status}, want the file this job built`);
              }
              for (const [header, value] of Object.entries(expectedHeadersFor(path))) {
                if (response.headers.get(header) !== value) {
                  throw new Error(
                    `${origin}${path}: ${header} is ${response.headers.get(header)}, want ${value}`,
                  );
                }
              }
              // The bytes, because Cloudflare caches and propagates each file
              // independently: a document served next to a stale file looks exactly like a
              // pass on a status, and on the service worker the stale file is the silent
              // push revoke the gate around this deploy exists to prevent.
              const served = Buffer.from(await response.arrayBuffer());
              if (!served.equals(built)) {
                throw new Error(
                  `${origin}${path} is ${served.byteLength} bytes and differs from the ${built.byteLength} byte file this job built`,
                );
              }
            }

            await fetchBuilt("/index.html", Buffer.from(shell));
            // Concurrently, because there are dozens of them and they are edge-cached.
            await Promise.all(
              [...builtAssets].map(([path, built]) => fetchBuilt(path, built)),
            );

            // Redirects are not followed, which is the point: a plain fetch follows a 307
            // and reports 200 with the right bytes, so a Worker that answered a deep link
            // with a hop to the homepage would pass everything above. The shell has to be
            // served, not reached.
            for (const path of deepLinks) {
              await fetchBuilt(path, Buffer.from(shell));
            }

            await fetchBuilt("/push-sw.js", builtPushServiceWorker);

            // Relative id and scope, so each host scopes its own origin: a manifest naming
            // one host absolutely would install a PWA that launches another, and the deep
            // links above would not cover the launch.
            const manifest = await fetch(`${origin}/site.webmanifest`, { redirect: "manual" });
            if (manifest.status !== 200) {
              throw new Error(`${origin}/site.webmanifest answered ${manifest.status}`);
            }
            const { id, start_url: startUrl, scope, icons = [] } = await manifest.json();
            if (id !== "/" || startUrl !== "/" || scope !== "/") {
              throw new Error(
                `${origin}/site.webmanifest scopes ${id} ${startUrl} ${scope}, want / / / on every host that serves the app`,
              );
            }
            // And the icons it names, or an install on this host gets a blank icon and
            // nothing above would notice.
            for (const icon of icons) {
              await fetchBuilt(icon.src, await readFile(`${clientDirectory}${icon.src}`));
            }
          }

          async function verify() {
            for (const origin of origins) {
              await verifyOrigin(origin);
            }
          }

          // A hostname Cloudflare has just been asked for has to resolve and present its
          // certificate before the first request is answered, and both outlast the sixty
          // seconds the Site and MCP checks allow — so this one waits longer. The first
          // release that claims the subdomain is the release that needs it.
          const ATTEMPTS = 30;
          const RETRY_MS = 10_000;

          let lastError;
          for (let attempt = 1; attempt <= ATTEMPTS; attempt += 1) {
            try {
              await verify();
              console.log(`Product app verified at ${origins.join(" and ")}`);
              process.exit(0);
            } catch (error) {
              lastError = error;
              console.warn(`Product app attempt ${attempt}/${ATTEMPTS} failed: ${error.message}`);
              await new Promise((resolve) => setTimeout(resolve, RETRY_MS));
            }
          }
          throw lastError;
          EOF

      - name: Enable Push delivery
        id: push_enable
        if: success()
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          # First enable sets a lastSeenAt floor so only devices that open the
          # app after the display-capable push-sw.js is live receive Push
          # (Safari silent-push revoke). Later deploys keep a finite >0 floor.
          set +e
          SINCE_ERR=$(mktemp)
          SINCE_OUT=$(pnpm --filter @pocketcircle/convex exec convex env get PUSH_DELIVERY_SINCE_MS 2>"$SINCE_ERR")
          SINCE_STATUS=$?
          set -e
          SINCE=$(printf '%s' "$SINCE_OUT" | tr -d '[:space:]')
          if node -e 'const v=Number(process.argv[1]); process.exit(Number.isFinite(v)&&v>0?0:1)' "$SINCE"; then
            rm -f "$SINCE_ERR"
          elif [ "$SINCE_STATUS" -ne 0 ] && ! grep -qi 'not found' "$SINCE_ERR"; then
            # Auth/transport flake — do not overwrite an existing rollout floor.
            echo "convex env get PUSH_DELIVERY_SINCE_MS failed (status=$SINCE_STATUS):" >&2
            cat "$SINCE_ERR" >&2
            rm -f "$SINCE_ERR"
            exit 1
          else
            rm -f "$SINCE_ERR"
            pnpm --filter @pocketcircle/convex exec convex env set PUSH_DELIVERY_SINCE_MS "$(node -e 'console.log(Date.now())')"
          fi
          pnpm --filter @pocketcircle/convex exec convex env set PUSH_DELIVERY_ENABLED 1

      - name: Restore Push delivery after failed or cancelled rollout
        if: (failure() || cancelled()) && steps.push_gate.outputs.previous_captured == 'true' && steps.push_enable.outcome != 'success'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          PREV="${{ steps.push_gate.outputs.previous }}"
          pnpm --filter @pocketcircle/convex exec convex env set PUSH_DELIVERY_ENABLED "$PREV"
      - name: Bind MCP Worker production config
        working-directory: packages/mcp-worker
        env:
          MCP_OAUTH_KV_NAMESPACE_ID: ${{ vars.MCP_OAUTH_KV_NAMESPACE_ID }}
          VITE_CONVEX_SITE_URL: ${{ vars.VITE_CONVEX_SITE_URL }}
        run: |
          python3 -c "
          from pathlib import Path
          from urllib.parse import urlparse
          import os

          path = Path('wrangler.jsonc')
          text = path.read_text()

          kv_id = os.environ['MCP_OAUTH_KV_NAMESPACE_ID']
          kv_needle = 'REPLACE_WITH_OAUTH_KV_NAMESPACE_ID'
          if not kv_id or kv_id == kv_needle:
              raise SystemExit('MCP_OAUTH_KV_NAMESPACE_ID must be a real KV namespace id')
          if kv_needle not in text:
              raise SystemExit('wrangler.jsonc missing OAuth KV placeholder')

          site_needle = 'https://placeholder.convex.site'
          parsed = urlparse(os.environ['VITE_CONVEX_SITE_URL'].strip())
          host = parsed.hostname or ''
          if (
              parsed.scheme != 'https'
              or parsed.username
              or parsed.password
              or not host
              or (host != 'convex.site' and not host.endswith('.convex.site'))
          ):
              raise SystemExit('VITE_CONVEX_SITE_URL must be a Convex *.convex.site HTTPS origin')
          origin = f'https://{host}' + (f':{parsed.port}' if parsed.port else '')
          if origin == site_needle:
              raise SystemExit('VITE_CONVEX_SITE_URL must be the real production Convex site URL')
          if site_needle not in text:
              raise SystemExit('wrangler.jsonc missing CONVEX_SITE_URL placeholder')

          path.write_text(text.replace(kv_needle, kv_id).replace(site_needle, origin))
          "

      - name: Install MCP Worker previous HMAC secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MCP_WORKER_HMAC_SECRET_PREVIOUS: ${{ secrets.MCP_WORKER_HMAC_SECRET_PREVIOUS }}
        working-directory: packages/mcp-worker
        run: |
          if [ -z "$MCP_WORKER_HMAC_SECRET_PREVIOUS" ]; then
            echo "No previous HMAC secret to install"
            exit 0
          fi
          printf '%s' "$MCP_WORKER_HMAC_SECRET_PREVIOUS" | pnpm exec wrangler secret put MCP_WORKER_HMAC_SECRET_PREVIOUS

      - name: Deploy MCP Worker
        uses: cloudflare/wrangler-action@v4
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.121.0"
          workingDirectory: packages/mcp-worker
          secrets: |
            MCP_WORKER_HMAC_SECRET
            MCP_WORKER_SIGNING_PRIVATE_JWK
        env:
          MCP_WORKER_HMAC_SECRET: ${{ secrets.MCP_WORKER_HMAC_SECRET }}
          MCP_WORKER_SIGNING_PRIVATE_JWK: ${{ secrets.MCP_WORKER_SIGNING_PRIVATE_JWK }}

      # wrangler secret delete prompts for confirmation; secret bulk with JSON
      # null is the documented non-interactive delete path (wrangler >= 4.97.0).
      # https://developers.cloudflare.com/workers/wrangler/commands/#secret-bulk
      - name: Remove MCP Worker previous HMAC secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MCP_WORKER_HMAC_SECRET_PREVIOUS: ${{ secrets.MCP_WORKER_HMAC_SECRET_PREVIOUS }}
        working-directory: packages/mcp-worker
        run: |
          if [ -n "$MCP_WORKER_HMAC_SECRET_PREVIOUS" ]; then
            echo "Keeping MCP_WORKER_HMAC_SECRET_PREVIOUS during rotation"
            exit 0
          fi
          set +e
          out=$(printf '%s\n' '{"MCP_WORKER_HMAC_SECRET_PREVIOUS":null}' | pnpm exec wrangler secret bulk 2>&1)
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if printf '%s' "$out" | grep -qiE 'not found|does not exist|no such secret'; then
            echo "MCP_WORKER_HMAC_SECRET_PREVIOUS already absent"
            exit 0
          fi
          printf '%s\n' "$out" >&2
          exit "$status"

      - name: Verify MCP Worker discovery
        env:
          VITE_MCP_WORKER_ORIGIN: ${{ vars.VITE_MCP_WORKER_ORIGIN }}
        run: |
          node --input-type=module <<'EOF'
          const origin = new URL(process.env.VITE_MCP_WORKER_ORIGIN).origin;
          const expected = {
            resource: `${origin}/mcp`,
            authorizationEndpoint: `${origin}/authorize`,
            tokenEndpoint: `${origin}/token`,
          };

          async function verify() {
            const [resourceResponse, serverResponse] = await Promise.all([
              fetch(`${origin}/.well-known/oauth-protected-resource`),
              fetch(`${origin}/.well-known/oauth-authorization-server`),
            ]);
            if (!resourceResponse.ok || !serverResponse.ok) {
              throw new Error(
                `discovery returned ${resourceResponse.status}/${serverResponse.status}`,
              );
            }
            const resource = await resourceResponse.json();
            const server = await serverResponse.json();
            if (
              resource.resource !== expected.resource ||
              resource.authorization_servers?.length !== 1 ||
              resource.authorization_servers[0] !== origin ||
              server.issuer !== origin ||
              server.authorization_endpoint !== expected.authorizationEndpoint ||
              server.token_endpoint !== expected.tokenEndpoint
            ) {
              throw new Error("discovery metadata does not match VITE_MCP_WORKER_ORIGIN");
            }
          }

          let lastError;
          for (let attempt = 1; attempt <= 12; attempt += 1) {
            try {
              await verify();
              console.log(`MCP discovery verified at ${origin}`);
              process.exit(0);
            } catch (error) {
              lastError = error;
              console.warn(`MCP discovery attempt ${attempt}/12 failed: ${error.message}`);
              await new Promise((resolve) => setTimeout(resolve, 5_000));
            }
          }
          throw lastError;
          EOF

      - name: Sync Convex release and Sentry env
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          APP_RELEASE_VERSION: ${{ steps.release.outputs.version }}
          APP_RELEASE_SHA: ${{ steps.release.outputs.sha }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
        run: |
          pnpm --filter @pocketcircle/convex exec convex env set APP_RELEASE "$APP_RELEASE_VERSION+$APP_RELEASE_SHA"
          pnpm --filter @pocketcircle/convex exec convex env set SENTRY_ENVIRONMENT production
          if [ -n "$VITE_SENTRY_DSN" ]; then
            pnpm --filter @pocketcircle/convex exec convex env set SENTRY_DSN "$VITE_SENTRY_DSN"
          else
            pnpm --filter @pocketcircle/convex exec convex env remove SENTRY_DSN
          fi

  release:
    needs: deploy
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.ref }}

      - name: Publish release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$GITHUB_REF_NAME"
          ./scripts/release-notes.sh "$version" > release-notes.md
          expected="$(tr -d '\r' < release-notes.md)"

          if ! gh release view "$version" >/dev/null 2>&1; then
            gh release create "$version" \
              --verify-tag \
              --title "$version" \
              --notes-file release-notes.md
            exit 0
          fi

          is_draft="$(gh release view "$version" --json isDraft --jq .isDraft)"
          if [[ "$is_draft" == true ]]; then
            # Draft notes are never trusted; overwrite from CHANGELOG, then publish.
            gh release edit "$version" \
              --verify-tag \
              --title "$version" \
              --notes-file release-notes.md \
              --draft=false
            exit 0
          fi

          actual="$(gh release view "$version" --json body --jq -r .body | tr -d '\r')"
          if [[ "$actual" == "$expected" ]]; then
            echo "GitHub Release $version already published with matching CHANGELOG notes."
            exit 0
          fi

          echo "::error::GitHub Release $version is published with notes that differ from CHANGELOG.md. Refusing to overwrite a public release."
          exit 1
