name: Deploy Production

on:
  push:
    tags: [v*]

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify release
    uses: ./.github/workflows/e2e.yml

  deploy:
    needs: verify
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://pocketcircle.app
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.ref }}

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Resolve immutable release
        id: release
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Production tags must be stable SemVer: vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate release notes
        run: ./scripts/release-notes.sh "${{ steps.release.outputs.version }}" >/dev/null

      - run: pnpm install --frozen-lockfile

      - name: Validate production configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          VITE_CONVEX_SITE_URL: ${{ vars.VITE_CONVEX_SITE_URL }}
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CONVEX_DEPLOY_KEY" || { echo "::error::Missing CONVEX_DEPLOY_KEY secret"; exit 1; }
          test -n "$VITE_CONVEX_URL" || { echo "::error::Missing VITE_CONVEX_URL variable"; exit 1; }
          test -n "$VITE_CONVEX_SITE_URL" || { echo "::error::Missing VITE_CONVEX_SITE_URL variable"; exit 1; }

      - run: pnpm validate

      - name: Build production web app
        env:
          APP_RELEASE_VERSION: ${{ steps.release.outputs.version }}
          APP_RELEASE_SHA: ${{ steps.release.outputs.sha }}
          VITE_CONVEX_SITE_URL: ${{ vars.VITE_CONVEX_SITE_URL }}
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
        run: pnpm build

      # Worker before Convex: a new backend default (analyticsEnabled for new
      # Users) must not go live while production still serves the previous client.
      # This Worker must tolerate the previous Convex until the next step
      # finishes. Additive Convex functions the client needs immediately belong
      # in an earlier release.
      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.121.0"

      - name: Deploy Convex production backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: pnpm --filter @pocketcircle/convex exec convex deploy -y

      - name: Sync Convex release and Sentry env
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          APP_RELEASE_VERSION: ${{ steps.release.outputs.version }}
          APP_RELEASE_SHA: ${{ steps.release.outputs.sha }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
        run: |
          pnpm --filter @pocketcircle/convex exec convex env set APP_RELEASE "$APP_RELEASE_VERSION+$APP_RELEASE_SHA"
          pnpm --filter @pocketcircle/convex exec convex env set SENTRY_ENVIRONMENT production
          if [ -n "$VITE_SENTRY_DSN" ]; then
            pnpm --filter @pocketcircle/convex exec convex env set SENTRY_DSN "$VITE_SENTRY_DSN"
          else
            pnpm --filter @pocketcircle/convex exec convex env remove SENTRY_DSN
          fi

  release:
    needs: deploy
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.ref }}

      - name: Publish release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if existing_draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null)"; then
            test "$existing_draft" = false || {
              echo "::error::GitHub Release $GITHUB_REF_NAME already exists as a draft. Publish or remove it before retrying."
              exit 1
            }
            echo "GitHub Release $GITHUB_REF_NAME already exists; treating this retry as complete."
            exit 0
          fi
          ./scripts/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
