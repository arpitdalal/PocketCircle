name: Deploy Production

on:
  push:
    tags: [v*]

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify release
    uses: ./.github/workflows/e2e.yml

  deploy:
    needs: verify
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://pocketcircle.app
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.ref }}

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Resolve immutable release
        id: release
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Production tags must be stable SemVer: vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate release notes
        run: ./scripts/release-notes.sh "${{ steps.release.outputs.version }}" >/dev/null

      - run: pnpm install --frozen-lockfile

      - name: Validate production configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          MCP_OAUTH_KV_NAMESPACE_ID: ${{ vars.MCP_OAUTH_KV_NAMESPACE_ID }}
          MCP_WORKER_HMAC_SECRET: ${{ secrets.MCP_WORKER_HMAC_SECRET }}
          VITE_CONVEX_SITE_URL: ${{ vars.VITE_CONVEX_SITE_URL }}
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
          VITE_MCP_WORKER_ORIGIN: ${{ vars.VITE_MCP_WORKER_ORIGIN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CONVEX_DEPLOY_KEY" || { echo "::error::Missing CONVEX_DEPLOY_KEY secret"; exit 1; }
          test -n "$MCP_OAUTH_KV_NAMESPACE_ID" || { echo "::error::Missing MCP_OAUTH_KV_NAMESPACE_ID variable"; exit 1; }
          test -n "$MCP_WORKER_HMAC_SECRET" || { echo "::error::Missing MCP_WORKER_HMAC_SECRET secret"; exit 1; }
          test -n "$VITE_CONVEX_URL" || { echo "::error::Missing VITE_CONVEX_URL variable"; exit 1; }
          test -n "$VITE_CONVEX_SITE_URL" || { echo "::error::Missing VITE_CONVEX_SITE_URL variable"; exit 1; }
          test -n "$VITE_MCP_WORKER_ORIGIN" || { echo "::error::Missing VITE_MCP_WORKER_ORIGIN variable"; exit 1; }

      - run: pnpm validate

      - name: Build production web app
        env:
          APP_RELEASE_VERSION: ${{ steps.release.outputs.version }}
          APP_RELEASE_SHA: ${{ steps.release.outputs.sha }}
          VITE_CONVEX_SITE_URL: ${{ vars.VITE_CONVEX_SITE_URL }}
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
          VITE_MCP_WORKER_ORIGIN: ${{ vars.VITE_MCP_WORKER_ORIGIN }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
        run: pnpm build

      # Convex before Worker: this release's web bundle needs additive Convex
      # fields/functions (Feature Announcements, #282) immediately. Deploy the
      # backward-compatible backend first. If Convex succeeds and the Worker
      # fails, leave the additive backend deployed and retry the Worker. Old
      # web code remains compatible with the new optional field and unused
      # functions. Breaking Convex changes still use expand-contract releases.
      - name: Deploy Convex production backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: pnpm --filter @pocketcircle/convex exec convex deploy -y

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.121.0"

      - name: Bind MCP OAuth KV namespace
        working-directory: packages/mcp-worker
        env:
          MCP_OAUTH_KV_NAMESPACE_ID: ${{ vars.MCP_OAUTH_KV_NAMESPACE_ID }}
        run: |
          python3 -c "
          from pathlib import Path
          import os
          kv_id = os.environ['MCP_OAUTH_KV_NAMESPACE_ID']
          path = Path('wrangler.jsonc')
          needle = 'REPLACE_WITH_OAUTH_KV_NAMESPACE_ID'
          if not kv_id or kv_id == needle:
              raise SystemExit('MCP_OAUTH_KV_NAMESPACE_ID must be a real KV namespace id')
          text = path.read_text()
          if needle not in text:
              raise SystemExit('wrangler.jsonc missing OAuth KV placeholder')
          path.write_text(text.replace(needle, kv_id))
          "

      - name: Deploy MCP Worker
        uses: cloudflare/wrangler-action@v4
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.121.0"
          workingDirectory: packages/mcp-worker
          secrets: |
            MCP_WORKER_HMAC_SECRET
        env:
          MCP_WORKER_HMAC_SECRET: ${{ secrets.MCP_WORKER_HMAC_SECRET }}

      - name: Sync Convex release and Sentry env
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          APP_RELEASE_VERSION: ${{ steps.release.outputs.version }}
          APP_RELEASE_SHA: ${{ steps.release.outputs.sha }}
          MCP_WORKER_HMAC_SECRET: ${{ secrets.MCP_WORKER_HMAC_SECRET }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
        run: |
          pnpm --filter @pocketcircle/convex exec convex env set APP_RELEASE "$APP_RELEASE_VERSION+$APP_RELEASE_SHA"
          pnpm --filter @pocketcircle/convex exec convex env set SENTRY_ENVIRONMENT production
          pnpm --filter @pocketcircle/convex exec convex env set MCP_WORKER_HMAC_SECRET "$MCP_WORKER_HMAC_SECRET"
          if [ -n "$VITE_SENTRY_DSN" ]; then
            pnpm --filter @pocketcircle/convex exec convex env set SENTRY_DSN "$VITE_SENTRY_DSN"
          else
            pnpm --filter @pocketcircle/convex exec convex env remove SENTRY_DSN
          fi

  release:
    needs: deploy
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.ref }}

      - name: Publish release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$GITHUB_REF_NAME"
          ./scripts/release-notes.sh "$version" > release-notes.md
          expected="$(tr -d '\r' < release-notes.md)"

          if ! gh release view "$version" >/dev/null 2>&1; then
            gh release create "$version" \
              --verify-tag \
              --title "$version" \
              --notes-file release-notes.md
            exit 0
          fi

          is_draft="$(gh release view "$version" --json isDraft --jq .isDraft)"
          if [[ "$is_draft" == true ]]; then
            # Draft notes are never trusted; overwrite from CHANGELOG, then publish.
            gh release edit "$version" \
              --verify-tag \
              --title "$version" \
              --notes-file release-notes.md \
              --draft=false
            exit 0
          fi

          actual="$(gh release view "$version" --json body --jq -r .body | tr -d '\r')"
          if [[ "$actual" == "$expected" ]]; then
            echo "GitHub Release $version already published with matching CHANGELOG notes."
            exit 0
          fi

          echo "::error::GitHub Release $version is published with notes that differ from CHANGELOG.md. Refusing to overwrite a public release."
          exit 1
