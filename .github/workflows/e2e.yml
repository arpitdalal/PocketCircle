name: E2E

# True end-to-end tests against a REAL, ephemeral self-hosted Convex backend (ADR 0019).
# Each shard boots its own OSS convex-backend image, deploys this project's functions
# (incl. the Better Auth component) with the flag-gated email+password bypass, starts the
# app against that backend, and runs Playwright with a real injected session. Google OAuth
# is never driven; production stays Google-only.

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e_shard:
    name: E2E shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3]
        shardTotal: [3]
    env:
      # Pinned to the exact image the viability spike validated (deterministic).
      # Re-pin when bumping the `convex` npm version; a mismatch fails at `convex deploy`.
      CONVEX_IMAGE: ghcr.io/get-convex/convex-backend@sha256:1f2044e3eac463ac78973b136c0baf72d4ada602611d853d6f99f280e29e0a98
      CONVEX_SELF_HOSTED_URL: http://127.0.0.1:3210
      VITE_CONVEX_URL: http://127.0.0.1:3210
      VITE_CONVEX_SITE_URL: http://127.0.0.1:3211
    steps:
      - uses: actions/checkout@v6

      # No `version:` — action-setup reads the pinned pnpm from package.json's
      # `packageManager` field. Specifying both errors (ERR_PNPM_BAD_PM_VERSION).
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          # jsdom 30 (tightest): ^22.22.2 || ^24.15 || >=26.
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Boot self-hosted Convex backend
        run: |
          docker run -d --name convex \
            -p 3210:3210 -p 3211:3211 \
            -e CONVEX_CLOUD_ORIGIN=http://127.0.0.1:3210 \
            -e CONVEX_SITE_ORIGIN=http://127.0.0.1:3211 \
            -e DISABLE_BEACON=true \
            "$CONVEX_IMAGE"
          echo "Waiting for backend…"
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3210/version && break || sleep 2
          done

      - name: Generate admin key
        run: echo "CONVEX_SELF_HOSTED_ADMIN_KEY=$(docker exec convex ./generate_admin_key.sh | tail -n1 | tr -d '\r')" >> "$GITHUB_ENV"

      - name: Configure auth env (test-only) + deploy backend
        working-directory: packages/convex
        run: |
          pnpm exec convex env set BETTER_AUTH_SECRET "ci-$(openssl rand -hex 16)"
          pnpm exec convex env set SITE_URL "http://127.0.0.1:5173"
          pnpm exec convex env set GOOGLE_CLIENT_ID "ci-dummy"
          pnpm exec convex env set GOOGLE_CLIENT_SECRET "ci-dummy"
          pnpm exec convex env set E2E_TEST_AUTH "1"
          pnpm exec convex deploy -y

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E shard
        run: pnpm exec playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Upload Playwright blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report/
          retention-days: 1
          overwrite: true

      - name: Backend logs on failure
        if: failure()
        run: docker logs convex || true

  # Preserve one required check and one report while the suite runs on three machines.
  true-e2e:
    name: true-e2e
    if: ${{ always() && !cancelled() }}
    needs: e2e_shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Download Playwright blob reports
        uses: actions/download-artifact@v8
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge Playwright reports
        run: pnpm exec playwright merge-reports --reporter=html,github ./all-blob-reports

      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: warn
          overwrite: true

      - name: Verify all E2E shards passed
        if: ${{ always() && needs.e2e_shard.result != 'success' }}
        run: |
          echo "::error::One or more E2E shards failed."
          exit 1
