name: Release

# Cuts the release tag, and only once the commit it will name has passed
# everything. This workflow exists because of v0.8.1 (#423).
#
# The tag is what makes a version number real. Once `refs/tags/v*` carries a
# release it is immutable, and GitHub reserves the name permanently — so a
# version that produced a tag cannot be re-cut. v0.8.1 was tagged by hand onto
# 51e359e2, a commit whose own CI run on `main` had already gone red; the deploy
# re-ran the same `pnpm validate`, failed at step 8 of 25, deployed nothing, and
# the fix shipped as v0.8.2 with v0.8.1 stranded on a deploy that never
# happened. A tag cut by hand, before anything had checked the commit, is a
# version spent before there is anything to show for it.
#
# So the tag is cut here, at the end, from a commit `main` has already cleared.
#
# The gate is main's own CI and E2E verdicts, waited for rather than re-run.
# Every push to `main` already runs typecheck, lint, the unit tests, both
# production builds and the real Playwright suite against a live Convex backend
# (ADR 0019). That is a strictly larger gate than re-running `pnpm validate` and
# two builds here would be, because it includes the E2E — and it costs seconds
# instead of the nine minutes a second run of the suite would put on every
# release. It is also the honest question: not "does this pass again" but "did
# the commit this tag will name, forever, pass".
#
# Waiting also means the common case never waits: main is normally already green,
# and the step returns on its first poll.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable SemVer to release, e.g. v0.8.3
        required: true
        type: string
      replace_unreleased_tag:
        description: >-
          Re-cut this version when its existing tag names a DIFFERENT commit and
          the failed deploy never reached production. Only for a failure known to
          have stopped before the first production mutation; see the recovery
          table in the README. Refuses if the version has a GitHub Release.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# One release at a time. A run in progress is never cancelled — it is holding the
# gate for a version somebody is waiting on. A pending run is replaced by a newer
# pending one, which is the right way round here: a second dispatch is a
# correction of the first, and the newest request is the one that should run.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    name: Gate release
    runs-on: ubuntu-latest
    permissions:
      # Spelled out even though it equals the workflow-level map, because a
      # job-level `permissions` REPLACES the workflow-level one and sets every
      # scope it does not name to `none` — it is not a merge. An earlier version of
      # this workflow named only `actions: read` here, which silently removed the
      # `contents: read` the checkout needs, and the Release workflow failed at step
      # 1 of every run having validated nothing. Nothing in CI would have caught
      # it, because CI does not execute workflows, so the test asserts it instead.
      #
      # `actions: read` is not optional either, and its absence is quieter than
      # the checkout's. `wait-for-main-gate.sh` lists workflow runs, which is an
      # Actions read, so without this scope `gh api` returns 403 — which the
      # script correctly reports as `unreadable` rather than as a red commit,
      # because an unreachable API is not evidence about the code. The result is a
      # gate that waits out its full 45 minutes on every release and then gives
      # up, having correctly refused to release anything.
      contents: read
      actions: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve release
        id: resolve
        env:
          REQUESTED: ${{ inputs.version }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The same shape `deploy.yml` gates on, and the same one
          # `scripts/release-notes.sh` and `packages/domain/src/changelog.ts`
          # parse. A version that is not this cannot be a changelog heading, and a
          # changelog heading that is not this cannot be released.
          if [[ ! "$REQUESTED" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release version must be stable SemVer: vMAJOR.MINOR.PATCH (got '$REQUESTED')"
            exit 1
          fi
          # `main` and not merely "a commit main once contained". A stale branch
          # whose tip was merged last week is an ancestor of main and would pass
          # an ancestry test, and releasing from it would tag and deploy code the
          # branch has been superseded by — while looking entirely healthy.
          if [[ "$DISPATCH_REF" != "refs/heads/main" ]]; then
            echo "::error::Release from '$DISPATCH_REF'. Run this workflow from main (Actions → Release → Run workflow, with main selected)."
            exit 1
          fi
          # Captured once, here, and passed to the cut job explicitly. `main` can
          # advance between this dispatch and that job, and the tag has to name
          # the commit this release was asked for rather than whatever main's tip
          # happens to be later.
          echo "version=$REQUESTED" >> "$GITHUB_OUTPUT"
          echo "sha=$DISPATCH_SHA" >> "$GITHUB_OUTPUT"
          echo "Gating $REQUESTED at $DISPATCH_SHA"

      # The same script `deploy.yml` runs, on the same changelog, so the two
      # cannot disagree about which version is releasable. A section that exists
      # but says nothing fails here rather than after the tag.
      - name: Validate release notes
        run: ./scripts/release-notes.sh "${{ steps.resolve.outputs.version }}" >/dev/null

      - name: Wait for main to clear this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/wait-for-main-gate.sh "${{ steps.resolve.outputs.sha }}"

  cut:
    name: Cut tag and deploy
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      # The only two writes this workflow has, and both are needed exactly once:
      # creating `refs/tags/<version>`, and dispatching the deploy that consumes
      # it. `Create a workflow dispatch event` is an Actions write, and an
      # unspecified scope is `none` — leaving it out fails the dispatch with a
      # 403 *after* the tag is already cut, which is the worst place to find out.
      #
      # `contents: write` on this repository can also rewrite `main`, which is a
      # much larger claim than cutting a tag deserves. GitHub offers no narrower
      # scope, and the tag is the price of making a version real at all.
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ needs.gate.outputs.sha }}

      - name: Create the release tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.gate.outputs.version }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          err="$(mktemp)"
          if gh api --method POST "repos/$GH_REPO/git/refs" \
            -f ref="refs/tags/$VERSION" -f sha="$SHA" >/dev/null 2>"$err"; then
            echo "Cut $VERSION at $SHA."
            rm -f "$err"
            exit 0
          fi

          # The create failed, which is either "this tag already exists" — the
          # ordinary re-run of a release whose dispatch or deploy did not finish,
          # and the case this branch exists for — or a real error. Which one it is
          # decides whether the version is still usable, so it is read back rather
          # than inferred from the message.
          #
          # Compared by the commit the tag resolves to, not by what the ref
          # endpoint reports. An annotated tag — which is what `git tag -a` makes,
          # and therefore what every hand-pushed release tag in this repo's history
          # is — reports the tag *object's* SHA, so comparing that to a commit
          # rejects a tag that names exactly the right commit. `resolve-tag-commit.sh`
          # dereferences, and is the one place in the repo that answers this.
          existing="$(./scripts/resolve-tag-commit.sh "$GH_REPO" "$VERSION" 2>/dev/null)" || {
            echo "::error::Could not cut refs/tags/$VERSION, and could not read it back either:"
            cat "$err" >&2
            rm -f "$err"
            exit 1
          }
          if [ "$existing" != "$SHA" ]; then
            # The tag names different code than this release wants. Whether that
            # is recoverable is not a fact about git, it is a question about what
            # the previous attempt did to production, and only the operator knows.
            #
            # It IS recoverable in exactly one case: the attempt failed before the
            # first production mutation (the MCP verification-keys sync), nothing
            # was ever published under the name, and the tag is therefore still
            # deletable under release immutability. Re-cutting the same number at
            # a fixed commit is what makes that recovery possible at all, and it is
            # the case the README's recovery table describes.
            #
            # Two things are checked rather than trusted. A GitHub Release is the
            # hard boundary — a published release reserves the name permanently —
            # so its presence refuses the re-cut whatever was asked for. And the
            # re-cut is opt-in, because "the deploy failed" and "the deploy failed
            # before touching anything" look identical from here.
            if [ "${{ inputs.replace_unreleased_tag }}" != "true" ]; then
              echo "::error::$VERSION already names $existing, not $SHA. If that attempt never reached production you can re-cut this version: fix the commit, then re-run with replace_unreleased_tag=true. If it did reach production, the version is spent — release the next one."
              rm -f "$err"
              exit 1
            fi
            if gh release view "$VERSION" >/dev/null 2>&1; then
              echo "::error::$VERSION has a published GitHub Release, so its tag cannot be moved and the name is permanently reserved. replace_unreleased_tag does not apply — release the next version."
              rm -f "$err"
              exit 1
            fi
            # Delete AND recreate, in this step. Deleting alone would leave the
            # name absent, and the very next step dispatches the deploy against
            # `refs/tags/$VERSION` — so the documented recovery would fail at the
            # dispatch and need a second, unexpected Release run to finish.
            #
            # Recreating here also means the version is never absent from the
            # repository between runs: a ref that exists naming the wrong commit
            # is recoverable and visible, whereas a name that has vanished looks
            # like a release that was cut and is now being rewritten.
            echo "No release published for $VERSION. Re-cutting it from $existing to $SHA."
            if ! gh api --method DELETE "repos/$GH_REPO/git/refs/tags/$VERSION" >/dev/null 2>>"$err"; then
              echo "::error::Could not delete refs/tags/$VERSION, so $VERSION cannot be re-cut at $SHA:"
              cat "$err" >&2
              exit 1
            fi
            if ! gh api --method POST "repos/$GH_REPO/git/refs" \
              -f ref="refs/tags/$VERSION" -f sha="$SHA" >/dev/null 2>>"$err"; then
              # The tag is gone and not replaced. Saying so plainly matters: this is
              # the one window where the name does not exist at all, and an operator
              # who is not told will read the next failure as a version collision.
              echo "::error::Deleted refs/tags/$VERSION but could not re-cut it at $SHA. The name now exists nowhere; re-run this workflow with the same version to cut it fresh."
              cat "$err" >&2
              exit 1
            fi
            echo "$VERSION now names $SHA."
          else
            echo "$VERSION already names $SHA — reusing it."
          fi
          rm -f "$err"

      - name: Deploy the tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.gate.outputs.version }}
          # Exported because `set -u` aborts on an unset name, and this step runs
          # AFTER the tag exists. A missing export here is the worst failure shape
          # this workflow has: the version is already spent on a tag, no deploy is
          # ever dispatched, and nothing reports it until someone notices the
          # release never started. It is named from the gate job's output rather
          # than recomputed, so it is the same SHA the gate cleared and the same
          # one the tag was cut at.
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          # A tag pushed with GITHUB_TOKEN does not trigger workflows, so the
          # deploy cannot wait on `deploy.yml`'s `push: tags` trigger the way a
          # hand-pushed tag would. It is dispatched explicitly instead, on the tag
          # ref itself — which is what keeps the `production` environment's
          # deployment branch policy satisfied, since that policy allows the tag
          # pattern `v*` and nothing else.
          #
          # Dispatching on the tag rather than passing a version in also means
          # `deploy.yml` needs no input for this: it reads `GITHUB_REF_NAME`, so
          # the version it releases, the commit it deploys and the changelog
          # section it publishes all still come from the tag, and there is no
          # second copy of the version to keep in step with the first.
          #
          # `gate_sha` is the binding that closes the window between the tag being
          # cut and the deploy starting. `--ref` alone resolves to whatever the tag
          # names when the dispatch begins, so a tag moved in between would deploy a
          # commit the gate never cleared — and the deploy's own tag check runs
          # after production has already been mutated. Passing the gated SHA lets
          # the deploy refuse at its first step, before touching anything.
          gh workflow run deploy.yml --repo "$GH_REPO" --ref "$VERSION" -f gate_sha="$SHA"
          echo "Dispatched deploy.yml for $VERSION against $SHA."

      # Hold this workflow open until the deployment it dispatched is finished.
      #
      # `gh workflow run` returns as soon as the dispatch is accepted, so without
      # this the `release` concurrency group is released while the production run is
      # still going. `deploy.yml` serializes on its own `production` group, which
      # allows one running and one pending run and replaces a pending one when a
      # third arrives — so releasing A, then B (queued behind A), then C would
      # replace B's pending deploy with C's. B's tag is already cut by then: B
      # never deploys and never publishes, which is the stranded version this whole
      # workflow exists to prevent, reached by releasing twice rather than failing
      # once. Waiting keeps the lock held for the whole release.
      - name: Wait for the deployment to finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/wait-for-deploy.sh "${{ github.repository }}" ".github/workflows/deploy.yml" "$SHA"
