packages:
  - "apps/*"
  - "packages/*"

overrides:
  # better-auth@1.6.x bundles @better-fetch/fetch@1.2.2; better-call@1.3.x still uses 1.1.21.
  # @convex-dev/better-auth crossDomainClient() types against whichever copy resolves → TS2322
  # vs createAuthClient() unless the workspace resolves a single fetch version (1.1.21 matches better-call).
  # 1.6.27 ships fetch 1.3.1 + better-call 1.4; still TS2322 against @convex-dev/better-auth@0.12.5 — deferred.
  "@better-fetch/fetch": 1.1.21
  # Keep kysely on 0.28 until a dedicated 0.29 bump (0.x minor; better-auth still accepts 0.28).
  kysely: 0.28.17
  # Pin past pnpm 11.21's 24h minimumReleaseAge (5.20260827.1 published same day as #318).
  "@cloudflare/workers-types": "5.20260826.1"

allowBuilds:
  '@biomejs/biome': true
  # posthog-js → core-js (postinstall copies polyfill modules)
  core-js: true
  core-js-pure: true
  esbuild: true
  lefthook: true
  msw: true
  workerd: true
